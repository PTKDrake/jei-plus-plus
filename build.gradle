plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.16.3'
    id 'maven-publish'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }

repositories {
    maven { url = 'https://maven.blamejared.com' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modCompileOnly "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
    modLocalRuntime "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
}

loom {
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = 'jei_plus_plus.refmap.json'
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    sourceCompatibility = JavaVersion.toVersion(21)
    targetCompatibility = JavaVersion.toVersion(21)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.register('testFabricConfig', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.lingmu0.JeiPlusPlusMod.FabricConfigSpecTest'
    workingDir = projectDir
}
// Regression checks are an ordinary Java process and do not bootstrap Minecraft.
tasks.named('test') { enabled = false }
apply from: 'gradle/verify-fabric.gradle'
